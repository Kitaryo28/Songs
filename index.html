<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Memories 🎵</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       MAIN MUSIC EXPERIENCE
  ========================== -->

  <main id="app">

    <!-- Background Photo -->
    <div class="photo-background">
      <div id="photoLayer"></div>
      <div class="vignette"></div>
      <div class="dark-overlay"></div>
    </div>


    <!-- Floating particles -->
    <div class="particles" id="particles"></div>


    <!-- Top title -->
    <header class="top-bar">

      <div class="live-dot"></div>

      <span>MEMORIES</span>

      <div class="top-line"></div>

    </header>


    <!-- Photo counter -->

    <div class="photo-counter">

      <span id="photoNumber">01</span>

      <span>/</span>

      <span id="totalPhotos">40</span>

    </div>


    <!-- Main content -->

    <section class="content">

      <!-- Small music indicator -->

      <div class="music-status">

        <span class="music-icon">♪</span>

        <span id="musicStatus">
          Playing...
        </span>

      </div>


      <!-- Lyrics -->

      <div class="lyrics-container">

        <div
          id="lyrics"
          class="lyrics"
        >
          Tap the button below
          to begin the memories...
        </div>

      </div>


      <!-- Music controls -->

      <div class="controls">

        <button
          id="playBtn"
          class="control-btn"
          aria-label="Play music"
        >
          ▶
        </button>


        <div class="progress-area">

          <div class="progress-track">

            <div
              id="progress"
              class="progress"
            ></div>

          </div>


          <div class="time-row">

            <span id="currentTime">
              0:00
            </span>

            <span id="duration">
              0:00
            </span>

          </div>

        </div>


        <button
          id="muteBtn"
          class="control-btn"
          aria-label="Mute music"
        >
          🔊
        </button>

      </div>

    </section>


    <!-- Start button -->

    <div
      id="startScreen"
      class="start-screen"
    >

      <div class="start-card">

        <div class="music-symbol">
          ♪
        </div>

        <h1>
          A Little Memory
        </h1>

        <p>
          Put your headphones on
          and press play.
        </p>

        <button
          id="startBtn"
          class="start-btn"
        >
          Begin ✨
        </button>

      </div>

    </div>


    <!-- Final screen -->

    <section
      id="ending"
      class="ending hidden"
    >

      <div class="ending-glow"></div>

      <div class="ending-content">

        <div class="ending-symbol">
          ♡
        </div>

        <p class="ending-small">
          THE END
        </p>

        <h1>
          Made by Kitaryo
        </h1>

        <div class="ending-names">

          <span>Shinra</span>

          <span>•</span>

          <span>28</span>

          <span>•</span>

          <span>?</span>

        </div>

        <p class="ending-message">
          Some memories deserve
          to be remembered forever.
        </p>

      </div>

    </section>


    <!-- Hidden audio -->

    <audio
      id="music"
      preload="auto"
    >
      <source
        src="music.mp3"
        type="audio/mpeg"
      >
    </audio>

  </main>


  <script src="script.js"></script>

</body>
</html>
